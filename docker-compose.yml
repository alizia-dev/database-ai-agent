# Local development stack. Copy .env.example to .env and fill in values first: `docker compose up --build`.
# One stack == one customer deployment (single-tenant). Production uses managed services; see docs/Deployment.md.
name: database-ai-agent

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: database_ai_agent
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d database_ai_agent"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  # Isolated demo customer database (Demo CRM). Never holds real customer data.
  demo-sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${DEMO_SQLSERVER_SA_PASSWORD:?Set DEMO_SQLSERVER_SA_PASSWORD in .env}
    ports:
      - "1433:1433"
    volumes:
      - demo-sqlserver-data:/var/opt/mssql

  api:
    build:
      context: .
      dockerfile: src/DatabaseAIAgent.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Platform: ${POSTGRES_CONNECTION_STRING:?Set POSTGRES_CONNECTION_STRING in .env}
      ConnectionStrings__Redis: ${REDIS_CONNECTION_STRING:?Set REDIS_CONNECTION_STRING in .env}
      PlatformDatabase__ApplyMigrationsOnStartup: "true"
      ApiSecurity__AllowedOrigins__0: http://localhost:4200
      ApiSecurity__AllowedOrigins__1: http://localhost:8081
    ports:
      - "5080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  workers:
    build:
      context: .
      dockerfile: src/DatabaseAIAgent.Workers/Dockerfile
    environment:
      DOTNET_ENVIRONMENT: Development
      ConnectionStrings__Platform: ${POSTGRES_CONNECTION_STRING}
      ConnectionStrings__Redis: ${REDIS_CONNECTION_STRING}
    depends_on:
      api:
        condition: service_started

  web:
    build:
      context: client/database-ai-agent-web
    ports:
      - "8081:8080"
    depends_on:
      - api

volumes:
  postgres-data:
  demo-sqlserver-data:
