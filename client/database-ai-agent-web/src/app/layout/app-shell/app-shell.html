<mat-sidenav-container class="shell">
  <mat-sidenav
    #drawer
    class="sidenav"
    [mode]="isHandset() ? 'over' : 'side'"
    [opened]="!isHandset()"
    [attr.role]="isHandset() ? 'dialog' : 'navigation'"
  >
    <div class="workspace-name">{{ workspaceName() }}</div>
    <mat-nav-list>
      @for (item of navItems(); track item.link) {
        <a
          mat-list-item
          [routerLink]="item.link"
          routerLinkActive
          #active="routerLinkActive"
          [activated]="active.isActive"
          (click)="isHandset() && drawer.close()"
        >
          <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
          <span matListItemTitle>{{ item.label }}</span>
        </a>
      }
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar class="topbar">
      @if (isHandset()) {
        <button mat-icon-button type="button" aria-label="Open navigation" (click)="drawer.toggle()">
          <mat-icon>menu</mat-icon>
        </button>
      }
      <span class="brand">Database AI Agent</span>
      <span class="spacer"></span>
      @if (auth.user(); as user) {
        <button mat-button type="button" [matMenuTriggerFor]="userMenu" aria-label="Account menu">
          <mat-icon>account_circle</mat-icon>
          <span class="user-name">{{ user.displayName }}</span>
        </button>
        <mat-menu #userMenu="matMenu">
          <div class="menu-identity" role="presentation">
            <div>{{ user.email }}</div>
            <div class="muted">{{ user.role }}</div>
          </div>
          <a mat-menu-item routerLink="/app/settings">
            <mat-icon>manage_accounts</mat-icon>
            <span>Account &amp; settings</span>
          </a>
          <button mat-menu-item type="button" (click)="logout()">
            <mat-icon>logout</mat-icon>
            <span>Sign out</span>
          </button>
        </mat-menu>
      }
    </mat-toolbar>

    <main class="page">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
